<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="M1LK logo: a glass of milk">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="0.55" stop-color="#16243f"/>
      <stop offset="1" stop-color="#25406b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#3b6fb5" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3b6fb5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8eef5"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6dfea"/>
    </linearGradient>
    <linearGradient id="splash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4ebf3"/>
    </linearGradient>
    <clipPath id="inside">
      <path d="M159 160 L353 160 L329 444 Q326 468 302 468 L210 468 Q186 468 183 444 Z"/>
    </clipPath>
  
    <linearGradient id="milkshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#c9d6e6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9fb3cc" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.62  0 0 0 0 0.72  0 0 0 0.16 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- milk -->
  <g clip-path="url(#inside)">
    <rect x="150" y="216" width="220" height="270" fill="url(#milk)"/>
    <rect x="150" y="216" width="220" height="270" fill="url(#milkshade)"/>
    <rect x="150" y="216" width="220" height="270" fill="#fff" filter="url(#grain)"/>
    <ellipse cx="256" cy="216" rx="96" ry="9" fill="#f8fbff"/>
  </g>

  <!-- a few drops just above the surface -->
  <g fill="#ffffff">
    <circle cx="182" cy="200" r="2"/>
    <circle cx="200" cy="190" r="7.5"/>
    <circle cx="224" cy="176" r="1.6"/>
    <circle cx="238" cy="202" r="3.2"/>
    <circle cx="262" cy="184" r="10"/>
    <circle cx="286" cy="203" r="1.8"/>
    <circle cx="300" cy="172" r="4.2"/>
    <circle cx="318" cy="196" r="6"/>
    <circle cx="338" cy="180" r="1.5"/>
  </g>

  <!-- glass -->
  <path d="M154 150 L358 150 L335 446 Q331 476 302 476 L210 476 Q181 476 177 446 Z" fill="url(#glass)"/>
  <path d="M154 150 L177 446 Q181 476 210 476 L302 476 Q331 476 335 446 L358 150"
        fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M182 214 L198 440" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
</svg>
