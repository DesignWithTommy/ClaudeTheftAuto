# Copy to `m1lk.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# VICTORY_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: VICTORY_GAME_DIR
game_dir = 'D:\m1lk-data\game'

# Derived data. Default: %LOCALAPPDATA%\M1LK\cache.   env: VICTORY_CACHE_DIR
# cache_dir = 'D:\m1lk-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\M1LK\data.   env: VICTORY_DATA_DIR
# data_dir = 'D:\m1lk-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: VICTORY_TEST_TITLES (separated by ';')
test_titles = []

[graphics]
# Set false to disable ray tracing or true to enable the experimental passes.
# The CLI switches --no-rt and --rt override VICTORY_RAY_TRACING (0 or 1), then this file.
# ray_tracing = false
